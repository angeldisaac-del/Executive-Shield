<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Executive Shield 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <header class="top-bar">
      <div class="brand">
        <span class="live-dot" id="badge-status">PORTADA EN VIVO</span>
        <h1>EXECUTIVE SHIELD</h1>
      </div>
      <div class="top-controls">
        <span class="xp-pill" id="xp-display">LVL 1 • 0 XP</span>
        <select id="lang-select" aria-label="Idioma">
          <option value="es">🇪🇸 ES</option>
          <option value="en">🇺🇸 EN</option>
          <option value="ru">🇷🇺 RU</option>
          <option value="pt">🇧🇷 PT</option>
          <option value="fr">🇫🇷 FR</option>
          <option value="zh">🇨🇳 ZH</option>
        </select>
      </div>
    </header>

    <section id="cover-panel" class="panel">
      <p class="agency-tag" id="agency-label">UNITED STATES SECRET SERVICE • USSS</p>
      <div class="leader-grid" id="leader-buttons"></div>
      <div class="mode-row">
        <button class="btn primary" id="btn-foot">🛡️ Escolta</button>
        <button class="btn" id="btn-drive">🚘 Convoy</button>
        <button class="btn" id="btn-heli">🚁 Helicóptero</button>
        <button class="btn" id="btn-fly">✈️ Avión VIP</button>
      </div>
    </section>

    <section id="mission-hud" class="hidden">
      <div class="mission-box">
        <div class="mission-meta">
          <span id="mission-type-tag" class="tag">RUTINA</span>
          <span id="vip-health">VIP: 100%</span>
        </div>
        <h2 id="mission-title">Traslado Diplomático</h2>
        <p id="mission-desc">Mantén el perímetro seguro.</p>
        <div class="mission-actions">
          <button class="btn small" id="btn-switch-gta">🔄 Cambiar Líder</button>
          <button class="btn small hidden" id="btn-gyro">📱 Activar Inclinación</button>
          <button class="btn small danger" id="btn-exit">✖ Portada</button>
        </div>
      </div>

      <div id="joystick-zone">
        <div id="joystick-stick"></div>
      </div>
    </section>

    <div id="decision-modal" class="modal hidden">
      <div class="modal-card">
        <span class="alert-badge" id="alert-title">⚠️ ALERTA DE SEGURIDAD</span>
        <p id="alert-text"></p>
        <div id="decision-options" class="decision-list"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
