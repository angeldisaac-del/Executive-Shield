<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Executive Shield 3D — Secret Service Operations</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { overflow: hidden; background: #090d16; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* Aviso obligatorio de giro horizontal */
    #portrait-warning {
      display: none; position: fixed; inset: 0; background: #050811; z-index: 100;
      flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px;
    }
    #portrait-warning .icon { font-size: 54px; margin-bottom: 16px; }
    #portrait-warning p { font-size: 16px; font-weight: 800; color: #38bdf8; max-width: 300px; }
    @media (orientation: portrait) {
      #portrait-warning { display: flex; }
    }

    /* PORTADA DEL JUEGO (Se oculta al iniciar la misión) */
    #cover-screen {
      position: fixed; inset: 0; z-index: 40;
      background: linear-gradient(135deg, rgba(6, 12, 24, 0.92), rgba(15, 23, 42, 0.85));
      display: flex; justify-content: space-between; align-items: center; padding: 24px 36px;
    }
    .cover-left { max-width: 48%; }
    .game-logo { font-size: 32px; font-weight: 900; letter-spacing: 1.5px; color: #f8fafc; text-shadow: 0 4px 18px rgba(56, 189, 248, 0.5); }
    .game-logo span { color: #38bdf8; }
    .game-sub { font-size: 12px; font-weight: 700; color: #94a3b8; margin-top: 4px; letter-spacing: 1px; }
    .lang-bar { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }

    .cover-right {
      width: 46%; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .sec-title { font-size: 11px; font-weight: 800; color: #38bdf8; letter-spacing: 0.8px; }
    .opt-row { display: flex; gap: 6px; flex-wrap: wrap; }

    button {
      background: rgba(30, 41, 59, 0.95); color: #f8fafc; border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px; padding: 7px 11px; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    button.active { background: #2563eb; border-color: #60a5fa; }
    #btn-start {
      margin-top: 6px; padding: 12px; font-size: 14px; font-weight: 900;
      background: linear-gradient(90deg, #16a34a, #22c55e); border: none; color: #052e16;
    }

    /* HUD EN PARTIDA (Limpio, sin menús estorbando) */
    #game-hud { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 15; }
    .hud-top {
      position: absolute; top: 10px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    .mission-card {
      background: rgba(9, 13, 22, 0.82); border-left: 4px solid #38bdf8;
      padding: 8px 12px; border-radius: 8px; max-width: 56%;
    }
    .m-text { font-size: 12px; font-weight: 800; color: #f8fafc; }
    .r-text { font-size: 11px; font-weight: 600; color: #fde047; margin-top: 3px; }

    .status-card {
      background: rgba(9, 13, 22, 0.82); padding: 8px 12px; border-radius: 8px; width: 220px;
    }
    .bar-row { margin-bottom: 5px; }
    .bar-head { display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; margin-bottom: 2px; }
    .bar-bg { width: 100%; height: 6px; background: #1e293b; border-radius: 99px; overflow: hidden; }
    #vip-fill { width: 100%; height: 100%; background: #22c55e; }
    #agent-fill { width: 100%; height: 100%; background: #38bdf8; }

    /* Controles inferiores en paisaje */
    .hud-bottom {
      position: absolute; bottom: 12px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .left-pad { pointer-events: auto; }
    #joy-base {
      width: 106px; height: 106px; border-radius: 50%;
      background: rgba(15, 23, 42, 0.65); border: 2px solid rgba(56, 189, 248, 0.5); position: relative;
    }
    #joy-knob {
      width: 40px; height: 40px; border-radius: 50%; background: #38bdf8;
      position: absolute; top: 31px; left: 31px;
    }
    #arr-pad { display: none; grid-template-columns: repeat(3, 42px); gap: 4px; }
    #arr-pad button { width: 42px; height: 42px; font-size: 15px; }
    #tilt-box { display: none; padding: 10px 14px; background: rgba(15, 23, 42, 0.8); border-radius: 10px; font-size: 12px; font-weight: 800; }

    .right-pad { pointer-events: auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .act-row { display: flex; gap: 6px; }
    .act-row button { padding: 9px 13px; font-size: 11px; }
    #btn-shoot { background: #b91c1c; border-color: #f87171; }
    #btn-board { background: #1d4ed8; border-color: #60a5fa; }
    #btn-flare { background: #d97706; border-color: #fbbf24; display: none; }

    .pedal-row { display: flex; gap: 8px; }
    .pedal { width: 84px; height: 48px; font-size: 11px; font-weight: 900; border-radius: 10px; }
    #btn-brake { background: #7f1d1d; }
    #btn-gas { background: #15803d; }

    /* Pantalla Final / Game Over */
    #end-screen {
      display: none; position: fixed; inset: 0; background: rgba(5, 8, 17, 0.92); z-index: 50;
      flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px;
    }
    #end-title { font-size: 28px; font-weight: 900; color: #ef4444; margin-bottom: 8px; }
    #end-desc { font-size: 14px; color: #e2e8f0; max-width: 420px; margin-bottom: 18px; }
  </style>
</head>
<body>
  <div id="portrait-warning">
    <div class="icon">📱🔄</div>
    <p id="txt-rotate">GIRA TU TELÉFONO EN HORIZONTAL (LANDSCAPE) PARA JUGAR</p>
  </div>

  <!-- PORTADA PRINCIPAL -->
  <div id="cover-screen">
    <div class="cover-left">
      <div class="game-logo">EXECUTIVE <span>SHIELD</span></div>
      <div class="game-sub" id="txt-sub">OPERACIONES DE PROTECCIÓN EJECUTIVA • SERVICIO SECRETO</div>
      <div class="lang-bar" id="lang-bar">
        <button data-lang="ES" class="active">ES</button>
        <button data-lang="EN">EN</button>
        <button data-lang="RU">RU</button>
        <button data-lang="ZH">中文</button>
        <button data-lang="FR">FR</button>
        <button data-lang="AR">العربية</button>
      </div>
    </div>

    <div class="cover-right">
      <div class="sec-title" id="lbl-sec-nation">1. ELIGE AL MANDATARIO</div>
      <div class="opt-row" id="nation-bar">
        <button data-nat="US" class="active" id="nat-us">EE. UU. — Pres. Marcus Cole</button>
        <button data-nat="RU" id="nat-ru">Rusia — Pres. Alexei Novikov</button>
        <button data-nat="CN" id="nat-cn">China — Pres. Liu Ming</button>
      </div>

      <div class="sec-title" id="lbl-sec-ctrl">2. CONTROLES</div>
      <div class="opt-row" id="ctrl-bar">
        <button data-ctrl="JOYSTICK" class="active" id="c-joy">Joystick</button>
        <button data-ctrl="ARROWS" id="c-arr">Flechas</button>
        <button data-ctrl="TILT" id="c-tilt">Giroscopio</button>
      </div>

      <button id="btn-start">INICIAR OPERACIÓN</button>
    </div>
  </div>

  <!-- HUD EN JUEGO -->
  <div id="game-hud">
    <div class="hud-top">
      <div class="mission-card">
        <div class="m-text" id="hud-mission">Misión 1/8</div>
        <div class="r-text" id="hud-radio">Central a Escolta 1...</div>
      </div>

      <div class="status-card">
        <div class="bar-row">
          <div class="bar-head"><span id="lbl-vip">PRESIDENTE</span><span id="val-vip">100%</span></div>
          <div class="bar-bg"><div id="vip-fill"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-head"><span id="lbl-agent">AGENTE</span><span id="val-agent">100%</span></div>
          <div class="bar-bg"><div id="agent-fill"></div></div>
        </div>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="left-pad">
        <div id="joy-base"><div id="joy-knob"></div></div>
        <div id="arr-pad">
          <div></div><button id="a-up">▲</button><div></div>
          <button id="a-left">◀</button><button id="a-down">▼</button><button id="a-right">▶</button>
        </div>
        <div id="tilt-box">📱 ↔️</div>
      </div>

      <div class="right-pad">
        <div class="act-row">
          <button id="btn-radio">RADIO APOYO</button>
          <button id="btn-cqc">GOLPE CQC</button>
          <button id="btn-shoot">DISPARAR</button>
          <button id="btn-board">SUBIR VIP</button>
          <button id="btn-flare">BENGALAS</button>
        </div>
        <div class="pedal-row">
          <button class="pedal" id="btn-brake">FRENAR</button>
          <button class="pedal" id="btn-gas">ACELERAR</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PANTALLA DE RESULTADO -->
  <div id="end-screen">
    <h1 id="end-title">OPERACIÓN FALLIDA</h1>
    <p id="end-desc"></p>
    <button id="btn-retry">VOLVER A LA PORTADA</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
